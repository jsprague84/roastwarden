# CI on GitHub: the checks a pull request must pass (CONTRIBUTING.md; docs/DEVELOPMENT.md,
# "Checks"). The project's own CI runs the same and adds the audits and browser checks against
# the built image.
#
# Rust comes from rust-toolchain.toml, the one place its version is named. Actions are pinned
# to a commit, their release in the comment beside it.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info: smaller targets and caches, the same tests.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain from rust-toolchain.toml
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # A dependency no crate uses. The release binary, pinned by checksum.
      - name: Unused dependencies
        run: |
          v=0.9.2
          curl -sfL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/machete.tgz "https://github.com/bnjbvr/cargo-machete/releases/download/v${v}/cargo-machete-v${v}-x86_64-unknown-linux-musl.tar.gz"
          echo "48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9  /tmp/machete.tgz" | sha256sum -c -
          tar xzf /tmp/machete.tgz -C /tmp
          install /tmp/cargo-machete-v${v}-x86_64-unknown-linux-musl/cargo-machete ~/.cargo/bin/
          cargo machete

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain from rust-toolchain.toml
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test

      - name: Test
        run: cargo test --workspace --locked

  licences:
    name: Licences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every crate's licence is compatible with AGPL-3.0-or-later (deny.toml; DEVELOPMENT.md,
      # "Licences"). The release binary, pinned by checksum.
      - name: cargo deny
        run: |
          v=0.20.2
          curl -sfL --retry 5 --retry-all-errors --retry-delay 10 -o /tmp/deny.tgz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${v}/cargo-deny-${v}-x86_64-unknown-linux-musl.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/deny.tgz" | sha256sum -c -
          tar xzf /tmp/deny.tgz -C /tmp
          /tmp/cargo-deny-${v}-x86_64-unknown-linux-musl/cargo-deny --locked check licenses

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      # Types, lint, format, unused code, the tests, the bundle (docs/DEVELOPMENT.md, "Lints").
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm test
      - run: npm run build
