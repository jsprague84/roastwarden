<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" font-family="'Atkinson Hyperlegible Next', AHN, Helvetica, Arial, sans-serif">
  <!-- The starter sketch's wiring (docs/esp32-starter.md): rendered to esp32-starter-wiring.png
       beside it. Two thermocouple boards share CLK and DO; a CS each. -->
  <rect width="920" height="500" fill="#ffffff"/>
  <defs>
    <style>
      .board { fill: #f4f1ea; stroke: #3a3631; stroke-width: 2; }
      .title { font-size: 17px; font-weight: 600; fill: #23201c; }
      .sub { font-size: 13px; fill: #5b554d; }
      .pin { font-size: 14px; font-weight: 600; fill: #23201c; }
      .note { font-size: 12.5px; fill: #5b554d; }
      .wire { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
      .dot { stroke: none; }
    </style>
  </defs>

  <!-- ESP32 -->
  <rect class="board" x="40" y="60" width="200" height="320" rx="6"/>
  <text class="title" x="60" y="92">ESP32</text>
  <text class="sub" x="60" y="111">DevKit, USB below</text>
  <rect x="115" y="380" width="50" height="14" fill="#9b958c"/>
  <g class="pin" text-anchor="end">
    <text x="228" y="155">3V3</text>
    <text x="228" y="195">GND</text>
    <text x="228" y="235">18</text>
    <text x="228" y="275">19</text>
    <text x="228" y="315">5</text>
    <text x="228" y="355">17</text>
  </g>

  <!-- Bean probe's board -->
  <rect class="board" x="560" y="30" width="170" height="190" rx="6"/>
  <text class="title" x="575" y="56">Bean probe (BT)</text>
  <text class="sub" x="575" y="74">MAX31855 or MAX6675</text>
  <g class="pin">
    <text x="572" y="105">VIN</text>
    <text x="572" y="135">GND</text>
    <text x="572" y="165">CLK</text>
    <text x="572" y="195">DO</text>
    <text x="640" y="195">CS</text>
  </g>

  <!-- Second probe's board -->
  <rect class="board" x="560" y="270" width="170" height="190" rx="6"/>
  <text class="title" x="575" y="296">Second probe (ET)</text>
  <text class="sub" x="575" y="314">MAX31855 or MAX6675</text>
  <g class="pin">
    <text x="572" y="345">VIN</text>
    <text x="572" y="375">GND</text>
    <text x="572" y="405">CLK</text>
    <text x="572" y="435">DO</text>
    <text x="640" y="435">CS</text>
  </g>

  <!-- Wires: power (red), ground (black), clock (amber), data (blue), CS BT (orange), CS ET (purple) -->
  <path class="wire" stroke="#c0392b" d="M240 150 H300 M300 100 V340 M300 100 H560 M300 340 H560"/>
  <circle class="dot" fill="#c0392b" cx="300" cy="150" r="5"/>
  <path class="wire" stroke="#23201c" d="M240 190 H340 M340 130 V370 M340 130 H560 M340 370 H560"/>
  <circle class="dot" fill="#23201c" cx="340" cy="190" r="5"/>
  <path class="wire" stroke="#c99a06" d="M240 230 H380 M380 160 V400 M380 160 H560 M380 400 H560"/>
  <circle class="dot" fill="#c99a06" cx="380" cy="230" r="5"/>
  <path class="wire" stroke="#2e78b7" d="M240 270 H420 M420 190 V430 M420 190 H560 M420 430 H560"/>
  <circle class="dot" fill="#2e78b7" cx="420" cy="270" r="5"/>
  <path class="wire" stroke="#e07a1f" d="M240 310 H460 V230 H634 V200"/>
  <path class="wire" stroke="#8e44ad" d="M240 350 H500 V482 H634 V440"/>
  <g fill="#3a3631">
    <circle cx="240" cy="150" r="4"/><circle cx="240" cy="190" r="4"/><circle cx="240" cy="230" r="4"/>
    <circle cx="240" cy="270" r="4"/><circle cx="240" cy="310" r="4"/><circle cx="240" cy="350" r="4"/>
  </g>

  <!-- Thermocouples -->
  <g class="pin" font-size="13">
    <text x="712" y="112" text-anchor="end">+</text><text x="712" y="142" text-anchor="end">−</text>
    <text x="712" y="352" text-anchor="end">+</text><text x="712" y="382" text-anchor="end">−</text>
  </g>
  <path class="wire" stroke="#d4b106" d="M730 107 H780 L800 122"/>
  <path class="wire" stroke="#c0392b" d="M730 137 H780 L800 122"/>
  <path d="M800 122 H880" stroke="#8a857d" stroke-width="7" stroke-linecap="round"/>
  <path class="wire" stroke="#d4b106" d="M730 347 H780 L800 362"/>
  <path class="wire" stroke="#c0392b" d="M730 377 H780 L800 362"/>
  <path d="M800 362 H880" stroke="#8a857d" stroke-width="7" stroke-linecap="round"/>
  <text class="note" x="790" y="160">K-type probe,</text>
  <text class="note" x="790" y="176">in the beans</text>
  <text class="note" x="790" y="400">K-type probe,</text>
  <text class="note" x="790" y="416">in the air</text>
  <text class="note" x="746" y="214">US colours: yellow +, red −</text>

  <text class="note" x="40" y="428">Pin names as printed on the boards:</text>
  <text class="note" x="40" y="445">CLK may read SCK, DO may read SO,</text>
  <text class="note" x="40" y="462">VIN may read VCC.</text>
</svg>
