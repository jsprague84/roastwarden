# cargo deny check licenses (CI's Audit job; docs/DEVELOPMENT.md, "Licences").
# Roastwarden is AGPL-3.0-or-later: every licence below is compatible with it. A dependency under
# a licence not listed fails CI; add it only after checking it is compatible and, for a notice
# licence, that the image's third-party notices (about.toml) carry its text.

[graph]
# The image's binaries: Linux on amd64 and arm64
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[licenses]
confidence-threshold = 0.9
allow = [
  "AGPL-3.0-or-later", # Roastwarden's own crates
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",             # serialport: file-level copyleft, its source is unmodified on crates.io
  "CDLA-Permissive-2.0", # webpki-roots: Mozilla's root certificates
]
