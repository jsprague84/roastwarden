[package]
name = "roastwarden-autotune"
version = "0.42.4"
edition = "2021"
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Relay autotuning for slow single-loop processes: the experiment, model identification, PI design and robustness. No roaster knowledge: reusable for ovens, kilns, heaters."


[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# ToSchema on the report's types for Roastwarden's OpenAPI document
utoipa = { version = "6", optional = true }

[features]
openapi = ["dep:utoipa"]

[dev-dependencies]
serde_json = "1"
