[package]
name = "roastwarden-server"
version = "0.42.3"
edition = "2021"
license.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "roastwarden-server"


[lints]
workspace = true

[lib]
name = "roastwarden_server"
path = "src/lib.rs"

[[bin]]
name = "roastwarden-server"
path = "src/main.rs"

# The command line for agents and people (docs/cli.md)
[[bin]]
name = "roast"
path = "src/bin/roast/main.rs"

[features]
# `test_support` (the whole server on a temporary database) for integration tests
test-support = []

[dependencies]
axum = { version = "0.8", features = ["macros", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-util", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
rumqttc = { version = "0.25", default-features = false }
prometheus = { version = "0.14", default-features = false }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "macros", "sqlite", "chrono", "json"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "request-id"] }

roastwarden-mqtt = { path = "../mqtt" }
roastwarden-core = { path = "../core", features = ["openapi"] }
roastwarden-autotune = { path = "../autotune", features = ["openapi"] }
chrono = { version = "0.4.42", features = ["serde"] }
# The ESP32 firmware download (firmware.rs): a PlatformIO project as a zip
zip = { version = "9.3", default-features = false, features = ["deflate-flate2"] }
# The owner's time zone by name (the `time_zone` setting, zone.rs): IANA rules, so DST is right
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
uuid = { version = "1.18.1", features = ["v4"] }
anyhow = "1.0.99"
tokio-modbus = { version = "0.17", features = ["tcp", "tcp-server", "rtu"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
async-trait = "0.1"
tokio-serial = { version = "5.4", default-features = false }
mdns-sd = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ciborium = "0.2"
sha2 = "0.10"
# ipps to a label printer: TLS with the one certificate the owner trusted (labels/print.rs)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
getrandom = "0.3"
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "std"] }
aes-gcm = "0.10"
hkdf = "0.12"
base64 = "0.22"
# The OpenAPI document from the handlers (crates/server/src/openapi.rs, docs/openapi.json)
utoipa = { version = "6", features = ["chrono", "preserve_order"] }
utoipa-axum = "0.3"
# The `roast` CLI
clap = { version = "4", features = ["derive", "env"] }

# Bag labels (labels.rs, docs/labels.md): Typst lays the sheet out, PDF and SVG from it
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
# Typst memoises in a global cache; evict after a render or it grows
comemo = "0.5.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
# A small PNG of one label for an agent that can see (`roast labels design check --png`)
typst-render = "0.15.1"
tiny-skia = "0.12"
# The render worker limits its own memory and CPU time (labels/sandbox.rs)
rlimit = "0.11.0"
# Fonts and images to the worker as CBOR byte strings, not arrays of numbers
serde_bytes = "0.11"
# Printing labels over IPP (labels/print.rs): the messages only; reqwest sends them
ipp = { version = "8", default-features = false }
http = "1"

# The router as a service: an approved call is made through it (approvals.rs)
tower = { version = "0.5", features = ["util"] }

# The built-in MQTT broker (broker.rs, ROASTWARDEN_BROKER_ADDR; docs/DEPLOY.md, "One container"):
# rmqtt as a library, its ACL plugin for the users and topics, retained messages in memory
rmqtt = { version = "0.24", default-features = false, features = ["plugin", "retain"] }
rmqtt-acl = "0.24"
rmqtt-retainer = { version = "0.24", default-features = false, features = ["ram"] }

[dev-dependencies]
# The example roasters' TC4 test opens a pseudo-terminal (connect_examples.rs)
libc = "0.2"
# Turns on `test-support` for the integration tests in tests/
roastwarden-server = { path = ".", features = ["test-support"] }
