# cargo audit (CI job "Audit", and `nix develop -c cargo audit` locally).
# Every ignore has a reason here; drop it when the reason goes away.
[advisories]
ignore = [
  # libsqlite3-sys 0.30 bundles a SQLite before 3.54.0, which can return stale memory when it
  # opens a database beside a crafted `-wal` of another page size. sqlx 0.9.0, the latest,
  # holds libsqlite3-sys below 0.38; the fix is in 0.39. The server opens only files it wrote
  # itself: its database and its own backups, each a single file with no `-wal`; no route takes
  # a database from a caller, and a staged restore moves the old `-wal` aside before the copy
  # is opened (ops/backups.rs). What is left is `roast restore <file>` run by hand on a
  # database from someone else that arrives with a `-wal` beside it: delete that `-wal` first.
  # Drop this with the sqlx release whose sqlite driver takes libsqlite3-sys 0.39.
  "RUSTSEC-2026-0459",
  # rustls-webpki 0.102.8: rumqttc 0.25.1 pins it but uses it only for an error type
  # (`TlsError::WebPki`). Certificates are verified by rustls 0.23 with rustls-webpki 0.103,
  # which has the fixes. Drop these when rumqttc moves to webpki 0.103.
  "RUSTSEC-2026-0049",
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
  "RUSTSEC-2026-0382",
  # quick-xml 0.38.4 (denial of service on hostile XML): Typst 0.15.1's bibliography support
  # (hayagriva → citationberg 0.7.0, the latest, pins quick-xml 0.38) parses CSL citation
  # styles with it. Bag labels never call bibliography(); an owner's design could only feed it
  # files the owner put in the data folder. Typst's xml() and SVG use roxmltree, not
  # quick-xml. Drop these when citationberg moves to quick-xml >= 0.41 (docs/labels.md).
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]
