# cargo about generate (scripts/notices.sh): the Rust crates in the server and roast binaries
# and the terms they come under, for the image's third-party notices (Settings → About).
# The same licences as deny.toml's allow list; private crates (Roastwarden's own) are left out.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
