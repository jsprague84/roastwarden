# Mosquitto for Roastwarden (SECURITY.md, "MQTT"). No anonymous clients: the server and
# each roaster sign in with their own name and password, and the ACL keeps a roaster to its own
# topics. The compose file's mqtt-users service writes `passwd` from .env (MQTT_PASSWORD for the
# server, MQTT_DEVICES for the roasters) and `acl` from acl.in at every start
# (docker/mosquitto/users.sh); edit acl.in, not acl.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# One listener, MQTT only (no WebSockets). Publish it on the LAN, never to the internet.
listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

max_connections 100
max_inflight_messages 20
max_queued_messages 100
# 256 KB: a telemetry frame is about 1 KB
max_packet_size 262144
